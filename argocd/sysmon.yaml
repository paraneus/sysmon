apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sysmon
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paraneus/sysmon
    targetRevision: HEAD
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true