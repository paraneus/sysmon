apiVersion: apps/v1
kind: Deployment
metadata:
  name: sysmon-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sysmon-ui
  template:
    metadata:
      labels:
        app: sysmon-ui
    spec:
      containers:
        - image: sysmon:0.1
          imagePullPolicy: IfNotPresent
          name: sysmon-ui
          ports:
            - containerPort: 8000